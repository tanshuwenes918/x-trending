name: Daily X Trending

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated country names"
        required: false
        default: "Global"
      categories:
        description: "Comma-separated category names"
        required: false
        default: "Technology,News,Business & Finance,Science,Travel,Gaming,Sports,Health & Fitness,cryptocurrency,cars,music,dance,celebrity,relationship,Movies & TV,Nature & Outdoors,food,meme,beauty,Pets,fashion,anime,religion,Home & Garden"
      output_format:
        description: "Export destination"
        required: false
        type: choice
        options:
          - feishu
          - json
          - both
          - preview
        default: "feishu"
      dry_run:
        description: "Skip Feishu export"
        required: false
        type: boolean
        default: false
      retry_from_run:
        description: "Optional failed run ID to reuse; leave blank to scrape fresh X data"
        required: false
        default: ""
      test_failure_alert:
        description: "Test Feishu failure alerts only; intentionally fails without scraping or sending a daily report"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-x-trending
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      failure_stage: ${{ steps.scrape.outputs.failure_stage || steps.retry.outputs.failure_stage }}
      failure_reason: ${{ steps.scrape.outputs.failure_reason || steps.retry.outputs.failure_reason }}

    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_ENABLED: "true"
      LLM_REQUIRED: "true"
      X_COOKIES: ${{ secrets.X_COOKIES }}
      X_STORAGE_STATE_B64: ${{ secrets.X_STORAGE_STATE_B64 }}
      X_COUNTRIES: ${{ inputs.countries || 'Global' }}
      X_CATEGORIES: ${{ inputs.categories || 'Technology,News,Business & Finance,Science,Travel,Gaming,Sports,Health & Fitness,cryptocurrency,cars,music,dance,celebrity,relationship,Movies & TV,Nature & Outdoors,food,meme,beauty,Pets,fashion,anime,religion,Home & Garden' }}
      X_EXPLORE_URL: https://x.com/i/jf/global-trending/home
      OUTPUT_FORMAT: ${{ inputs.output_format || 'feishu' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      OUTPUT_DIR: outputs
      TIMEZONE: Asia/Shanghai
      MAX_TRENDS_PER_CATEGORY: 10
      MAX_TWEETS_PER_TREND: 5
      LLM_REQUEST_TIMEOUT: 300
      MAX_CANDIDATES_PER_CATEGORY: 30
      SCROLLS_PER_CATEGORY: 7
      MAX_ITEMS_PER_GROUP: 5
      TOP_ACTION_COUNT: 5
      LOOKBACK_HOURS: 24

    steps:
      - name: Simulate failure for alert test
        if: ${{ inputs.test_failure_alert }}
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest -q tests

      - name: Download saved retry input
        if: ${{ inputs.retry_from_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: x-trending-output
          path: retry-input
          run-id: ${{ inputs.retry_from_run }}
          github-token: ${{ github.token }}

      - name: Scrape and export
        id: scrape
        if: ${{ inputs.retry_from_run == '' }}
        run: python main.py

      - name: Retry saved input and export
        id: retry
        if: ${{ inputs.retry_from_run != '' }}
        run: |
          python - <<'PY'
          import runpy
          import sys
          from pathlib import Path

          checkpoints = list(Path("retry-input").glob("retry_input_*.json"))
          if len(checkpoints) != 1:
              raise SystemExit("Expected exactly one retry_input JSON in the selected run artifact")
          sys.argv = ["main.py", "--input-json", str(checkpoints[0])]
          runpy.run_path("main.py", run_name="__main__")
          PY

      - name: Upload JSON output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-trending-output
          path: outputs/*.json
          if-no-files-found: ignore

  notify_failure:
    needs: scrape
    if: ${{ always() && needs.scrape.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - name: Notify Feishu of failed daily report
        uses: actions/github-script@v7
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          FAILED_STAGE: ${{ needs.scrape.outputs.failure_stage }}
          FAILED_REASON: ${{ needs.scrape.outputs.failure_reason }}
          IS_ALERT_TEST: ${{ inputs.test_failure_alert || false }}
        with:
          script: |
            const webhook = process.env.FEISHU_WEBHOOK_URL;
            if (!webhook) {
              core.setFailed('Feishu alert webhook is not configured.');
              return;
            }
            const isTest = process.env.IS_ALERT_TEST === 'true';
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT || 1);
            let stage = process.env.FAILED_STAGE || '';
            let reason = process.env.FAILED_REASON || '请打开任务日志查看失败原因。';
            if (isTest) {
              stage = '告警链路测试';
              reason = '这是一条测试消息，用于确认失败告警可以送达；本次没有抓取 X 或发送日报。';
            } else if (!stage) {
              try {
                const { data } = await github.rest.actions.listJobsForWorkflowRunAttempt({
                  ...context.repo,
                  run_id: context.runId,
                  attempt_number: attempt,
                  per_page: 100,
                });
                const job = data.jobs.find(item => item.name === 'scrape');
                const failedStep = job?.steps?.find(step =>
                  ['failure', 'timed_out'].includes(step.conclusion));
                const stages = {
                  'Checkout': '检出代码',
                  'Set up Python': '准备 Python 环境',
                  'Cache Playwright browsers': '准备浏览器缓存',
                  'Install dependencies': '安装依赖',
                  'Run tests': '运行测试',
                  'Download saved retry input': '下载补跑数据',
                  'Scrape and export': '抓取、摘要或推送',
                  'Retry saved input and export': '使用保存数据生成日报',
                  'Upload JSON output': '上传日报数据附件',
                };
                stage = stages[failedStep?.name] || '任务执行或超时';
                if (failedStep?.name === 'Upload JSON output') {
                  reason = '保存任务附件失败，日报可能已经推送，请先查看群消息和任务日志。';
                }
              } catch {
                core.warning('Could not identify the failed step; sending a general alert.');
              }
            }
            stage ||= '任务执行';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const time = new Date().toLocaleString('zh-CN', {
              timeZone: 'Asia/Shanghai', hour12: false,
            });
            const line = text => [{ tag: 'text', text }];
            const payload = {
              msg_type: 'post',
              content: { post: { zh_cn: {
                title: isTest ? '🧪 X 日报失败告警测试' : '⚠️ X 日报任务失败',
                content: [
                  line(`北京时间：${time}`),
                  line(`失败环节：${stage}`),
                  line('排查提示：'),
                  ...reason.split('；').filter(Boolean).map(part => line(part.trim())),
                  line(`任务 ID：${context.runId}；第 ${attempt} 次尝试`),
                  [{ tag: 'a', text: '查看任务详情与日志', href: runUrl }],
                ],
              } } },
            };
            if (process.env.FEISHU_SECRET) {
              const { createHmac } = require('node:crypto');
              payload.timestamp = String(Math.floor(Date.now() / 1000));
              payload.sign = createHmac('sha256', `${payload.timestamp}\n${process.env.FEISHU_SECRET}`)
                .update('').digest('base64');
            }
            try {
              const response = await fetch(webhook, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=utf-8' },
                body: JSON.stringify(payload),
                signal: AbortSignal.timeout(15000),
              });
              if (!response.ok) {
                core.setFailed(`Feishu failure alert was rejected (HTTP ${response.status}).`);
                return;
              }
              const result = await response.json();
              if ((result.code ?? result.StatusCode) !== 0) {
                core.setFailed('Feishu failure alert was rejected; check the webhook and signing settings.');
                return;
              }
              core.info('Failure alert sent to Feishu successfully.');
            } catch {
              core.setFailed('Feishu failure alert could not be confirmed; check the webhook, signing settings, and network.');
            }
